services:
  searxng:
    build: ./infra/searxng
    environment:
      SEARXNG_SECRET: local-development-only
      SEARXNG_BASE_URL: "http://localhost:8080/"
    ports:
      - "8080:8080"
    restart: unless-stopped

  crawl4ai:
    build: ./infra/crawl4ai
    shm_size: 1gb
    ports:
      - "11235:11235"
    restart: unless-stopped
