<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ESG Intel" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>ESG Intelligence</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Light is default;
      // only an explicit saved "dark" preference switches to dark.
      //
      // Runs before React, so this is the one place the stored preference is
      // migrated: the old build wrote "dark" on every mount, so a stored "dark"
      // does not distinguish a deliberate choice from the old default. Everyone
      // is moved to light once; the flag means a later choice of dark sticks.
      (function () {
        try {
          if (!localStorage.getItem("polyfintech-theme-migrated")) {
            localStorage.setItem("polyfintech-theme-migrated", "light-default-v1");
            if (localStorage.getItem("polyfintech-theme") === "dark") {
              localStorage.removeItem("polyfintech-theme");
            }
          }
          var saved = localStorage.getItem("polyfintech-theme");
          document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="bg-canvas">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
